name = "comet-hop-leaderboard"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to post scores from a browser. Comma-separated, no trailing slash.
ALLOWED_ORIGINS = "https://tombawden.dev,https://tommyb86.github.io,http://localhost:8080"

[[d1_databases]]
binding = "DB"
database_name = "comet-hop"
# Replace with the id printed by `npx wrangler d1 create comet-hop`.
database_id = "00000000-0000-0000-0000-000000000000"
